name: Update Blog Posts

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update blog posts from Gists
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://gist.github.com/yama-lei.atom"

          max_post_count: 10

          # Only keep:
          # [tech] ...
          # [note] ...
          # [thinking] ...
          # [post] ...
          #
          # Matching is case-insensitive.
          # The prefix is removed before writing to README.
          item_exec: |
            const prefix = /^\[(tech|note|thinking|post)\]\s*/i;

            if (!post.title || !prefix.test(post.title)) {
              post = null;
            } else {
              post.title = post.title.replace(prefix, "");
            }

          template: "- `$date` [$title]($url)$newline"

          date_format: "yyyy-mm-dd"

          commit_message: "docs: update blog posts"

          enable_keepalive: false
